name: Build packages

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # never cancel a tag build: it feeds the release job
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # ECU database: bundled into both Windows installers and attached to every release.
  # To ship a newer one, change both values (the sha256 is shown next to the asset on the release page).
  ECU_ZIP_URL: https://github.com/Tarodictrl/ddt4all-ui/releases/download/v3.2.0/ecu.zip
  ECU_ZIP_SHA256: 6d87b3d6cdb2d80e93fe59219600016da53c4788621c2e03b3f55dd4809da419

jobs:
  ecu-db:
    name: ECU database
    runs-on: ubuntu-latest
    steps:
      - name: Download ecu.zip
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 10 -o ecu.zip "${ECU_ZIP_URL}"
          echo "${ECU_ZIP_SHA256}  ecu.zip" | sha256sum -c -
          ls -lh ecu.zip

      # the file is a zip already: store it as is instead of compressing it again
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ecu-db
          path: ecu.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute version
        id: version
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # Read the version from the three places that define it, without importing the package.
          cat > "${RUNNER_TEMP}/read_version.py" <<'PY'
          import ast
          import pathlib
          import re
          import sys

          SOURCES = {
              "version.py": "src/ddt4all/version.py",
              "pyproject": "pyproject.toml",
              "version.h": "setup_tools/inno-win-setup/version.h",
          }


          def read(which):
              text = pathlib.Path(SOURCES[which]).read_text(encoding="utf-8-sig")
              if which == "version.py":
                  for node in ast.parse(text).body:
                      if isinstance(node, ast.Assign) and any(
                          isinstance(t, ast.Name) and t.id == "__version__" for t in node.targets
                      ):
                          return str(ast.literal_eval(node.value))
                  return None
              if which == "pyproject":
                  # the version key of the [project] table
                  table = re.search(r"^\[project\]\s*$(.*?)(?=^\[|\Z)", text, re.M | re.S)
                  match = re.search(r'^version\s*=\s*"([^"]+)"', table.group(1) if table else "", re.M)
                  return match.group(1) if match else None
              match = re.search(r'^\s*#define\s+__version__\s+"([^"]+)"', text, re.M)
              return match.group(1) if match else None


          value = read(sys.argv[1])
          if not value:
              sys.exit("error: could not find the version in " + SOURCES[sys.argv[1]])
          print(value)
          PY
          PY_VERSION="$(python3 "${RUNNER_TEMP}/read_version.py" version.py)"
          TOML_VERSION="$(python3 "${RUNNER_TEMP}/read_version.py" pyproject)"
          ISS_VERSION="$(python3 "${RUNNER_TEMP}/read_version.py" version.h)"
          echo "src/ddt4all/version.py __version__ : ${PY_VERSION}"
          echo "pyproject.toml [project] version   : ${TOML_VERSION}"
          echo "inno-win-setup/version.h __version__: ${ISS_VERSION}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Tag ${GITHUB_REF_NAME} -> release version ${VERSION}"
            BAD=0
            for pair in \
              "src/ddt4all/version.py:${PY_VERSION}" \
              "pyproject.toml:${TOML_VERSION}" \
              "setup_tools/inno-win-setup/version.h:${ISS_VERSION}"; do
              if [ "${pair#*:}" != "${VERSION}" ]; then
                echo "::error::Tag ${GITHUB_REF_NAME} does not match ${pair%%:*}, which says '${pair#*:}'. Bump the version there (or retag) and try again."
                BAD=1
              fi
            done
            if [ "${BAD}" -ne 0 ]; then exit 1; fi
          else
            # <version>-dev.<run number>.<short sha>: the run number keeps dev builds ordered
            VERSION="${PY_VERSION}-dev.${RUN_NUMBER}.${COMMIT_SHA:0:7}"
          fi
          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  windows-installer:
    name: Windows installer ${{ matrix.arch }}
    needs: [version, ecu-db]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            python: "3.13.2"
            python-arch: x64
            python-dir: Python313
            inno: "6.2.2"
            iss: wininstaller.iss
          - arch: x86
            python: "3.8.6"
            python-arch: x86
            python-dir: Python38-32
            inno: "5.6.1"
            iss: wininstaller-py3.8.6-inno-5-32-bits.iss
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python }} ${{ matrix.python-arch }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.python-arch }}

      - name: Install Inno Setup ${{ matrix.inno }}
        run: choco install innosetup --version ${{ matrix.inno }} --confirm --no-progress --allow-downgrade --force
        shell: pwsh

      - name: Prepare Python ${{ matrix.python }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $drive = (Get-Item $env:GITHUB_WORKSPACE).PSDrive.Root
          $dist = "$drive\DDT4ALL-Dist-Versions\${{ matrix.python-dir }}"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          # Use setup-python installed Python, install deps, then copy whole install
          $pythonSrc = (Get-Command python).Source.Replace('\python.exe','')
          # Install project deps first
          pip install -e "$env:GITHUB_WORKSPACE[dev,can,network,bluetooth]" --no-warn-script-location --disable-pip-version-check
          # Copy Python install to dist dir
          Copy-Item -Path "$pythonSrc\*" -Destination $dist -Recurse -Force
          Write-Host "Python copied from $pythonSrc to $dist"
          & "$dist\python.exe" -c "import ddt4all; print('ddt4all OK')"

      # the .iss files pick ecu.zip up from their own folder
      - name: Get ECU database
        uses: actions/download-artifact@v8
        with:
          name: ecu-db
          path: setup_tools/inno-win-setup

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup *" -Filter ISCC.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { $iscc = Get-ChildItem -Path "${env:ProgramFiles}\Inno Setup *" -Filter ISCC.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "Using ISCC: $iscc"
          & $iscc "setup_tools\inno-win-setup\${{ matrix.iss }}"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      # The .iss files name the installer after __version__/__codename__; rename it
      # to the common DDT4ALL-UI-<version>-<platform>-<arch> scheme.
      - name: Collect installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $built = @(Get-ChildItem "setup_tools\inno-win-setup\Output\*.exe")
          if ($built.Count -ne 1) { throw "Expected exactly one installer, found $($built.Count)" }
          New-Item -ItemType Directory -Force -Path dist-packages | Out-Null
          $target = "dist-packages\DDT4ALL-UI-$env:VERSION-windows-${{ matrix.arch }}-setup.exe"
          Copy-Item $built[0].FullName $target
          Get-Item $target | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-${{ matrix.arch }}
          path: dist-packages/*.exe
          if-no-files-found: error
          retention-days: 14

  windows-portable:
    name: Windows portable
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[can,network]"
          python -m pip install pyinstaller==6.22.3

      - name: Build portable zip
        shell: pwsh
        run: ./setup_tools/windows/build-portable.ps1 $env:VERSION

      - name: Smoke test (unzip and start)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem dist-packages\*.zip | Select-Object -First 1
          if (-not $zip) { throw "No portable zip produced" }
          $dest = Join-Path $env:RUNNER_TEMP "portable-check"
          Expand-Archive -Path $zip.FullName -DestinationPath $dest -Force
          $exe = Join-Path $dest "DDT4ALL-UI\DDT4ALL-UI.exe"
          if (-not (Test-Path $exe)) { throw "DDT4ALL-UI.exe not found in $($zip.Name)" }
          Write-Host "OK: $exe"

          # Start the app headless with a temporary DDT4ALL_HOME; it must still be running after 20 s.
          $home_dir = Join-Path $env:RUNNER_TEMP "ddt4all-ui-home"
          New-Item -ItemType Directory -Force -Path $home_dir | Out-Null
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:DDT4ALL_HOME = $home_dir
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($proc.HasExited) { throw "DDT4ALL-UI.exe exited early with code $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force
          Write-Host "OK: DDT4ALL-UI.exe was still running after 20 s"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: dist-packages/*.zip
          if-no-files-found: error
          retention-days: 14

  linux-appimage:
    name: Linux AppImage
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libgl1 \
            libfuse2 \
            libbluetooth-dev

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -e ".[can,network,bluetooth]"

      - name: Build AppImage
        run: bash setup_tools/appimage/build.sh "${VERSION}"

      # build.sh writes ddt4all-ui-<version>-x86_64.AppImage; rename to the common scheme.
      - name: Collect AppImage
        run: |
          set -euo pipefail
          mkdir -p dist-packages
          mv "ddt4all-ui-${VERSION}-x86_64.AppImage" "dist-packages/DDT4ALL-UI-${VERSION}-linux-x86_64.AppImage"
          ls -lh dist-packages

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: dist-packages/*.AppImage
          if-no-files-found: error
          retention-days: 14

  linux-packages:
    name: Linux deb/rpm
    needs: version
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ruby ruby-dev rpm build-essential \
            libgl1 libbluetooth-dev \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 \
            libxcb-xinerama0 libxkbcommon-x11-0
          sudo gem install --no-document fpm -v 1.16.0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[can,network]"
          python -m pip install pyinstaller==6.22.3

      - name: Build deb and rpm
        run: bash setup_tools/linux/build-packages.sh "${VERSION}"

      - name: Smoke test (install .deb)
        run: |
          set -euo pipefail
          ls -lh dist-packages
          sudo apt-get install -y ./dist-packages/*.deb
          test -e /opt/ddt4all-ui/DDT4ALL-UI
          dpkg -L ddt4all-ui | grep -E 'ddt4all-ui\.desktop$'

      # exit 124 from timeout = the app was still running after 20 s = success
      - name: Smoke test (start the installed app)
        run: |
          set +e
          DDT4ALL_HOME="$(mktemp -d)" QT_QPA_PLATFORM=offscreen timeout 20 /opt/ddt4all-ui/DDT4ALL-UI
          rc=$?
          [ "$rc" -eq 124 ] || { echo "smoke failed rc=$rc"; exit 1; }
          echo "OK: the app was still running after 20 s"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist-packages/*.deb
            dist-packages/*.rpm
          if-no-files-found: error
          retention-days: 14

  macos-dmg:
    name: macOS dmg
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[can,network]"
          python -m pip install pyinstaller==6.22.3

      - name: Build dmg
        run: bash setup_tools/mac-os/builddmg.sh "${VERSION}"

      - name: Smoke test (start the app)
        run: |
          set -euo pipefail
          APP="build/macos-dmg/pyinstaller/dist/DDT4ALL UI.app"
          test -x "${APP}/Contents/MacOS/DDT4ALL-UI"
          DDT4ALL_HOME="$(mktemp -d)" QT_QPA_PLATFORM=offscreen "${APP}/Contents/MacOS/DDT4ALL-UI" &
          PID=$!
          sleep 20
          if ! kill -0 "${PID}" 2>/dev/null; then
            echo "smoke failed: the app exited within 20 s"
            exit 1
          fi
          kill "${PID}"
          wait "${PID}" || true
          echo "OK: the app was still running after 20 s"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist-packages/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - ecu-db
      - windows-installer
      - windows-portable
      - linux-appimage
      - linux-packages
      - macos-dmg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true

      - name: List files
        run: ls -lh release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-files/*
