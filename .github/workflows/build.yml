name: Build packages

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # never cancel a tag build: it feeds the release job
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # parse src/ddt4all/version.py without importing the package
            cat > "${RUNNER_TEMP}/read_version.py" <<'PY'
          import ast
          import pathlib

          tree = ast.parse(pathlib.Path("src/ddt4all/version.py").read_text(encoding="utf-8"))
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(t, ast.Name) and t.id == "__version__" for t in node.targets
              ):
                  print(ast.literal_eval(node.value))
                  break
          PY
            BASE="$(python3 "${RUNNER_TEMP}/read_version.py")"
            VERSION="${BASE}-dev.${COMMIT_SHA:0:7}"
          fi
          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  windows-installer:
    name: Windows installer ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            python: "3.13.2"
            python-arch: x64
            python-dir: Python313
            inno: "6.2.2"
            iss: wininstaller.iss
          - arch: x86
            python: "3.8.6"
            python-arch: x86
            python-dir: Python38-32
            inno: "5.6.1"
            iss: wininstaller-py3.8.6-inno-5-32-bits.iss
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }} ${{ matrix.python-arch }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.python-arch }}

      - name: Install Inno Setup ${{ matrix.inno }}
        run: choco install innosetup --version ${{ matrix.inno }} --confirm --no-progress --allow-downgrade --force
        shell: pwsh

      - name: Prepare Python ${{ matrix.python }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $drive = (Get-Item $env:GITHUB_WORKSPACE).PSDrive.Root
          $dist = "$drive\DDT4ALL-Dist-Versions\${{ matrix.python-dir }}"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          # Use setup-python installed Python, install deps, then copy whole install
          $pythonSrc = (Get-Command python).Source.Replace('\python.exe','')
          # Install project deps first
          pip install -e "$env:GITHUB_WORKSPACE[dev,can,network,bluetooth]" --no-warn-script-location --disable-pip-version-check
          # Copy Python install to dist dir
          Copy-Item -Path "$pythonSrc\*" -Destination $dist -Recurse -Force
          Write-Host "Python copied from $pythonSrc to $dist"
          & "$dist\python.exe" -c "import ddt4all; print('ddt4all OK')"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup *" -Filter ISCC.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { $iscc = Get-ChildItem -Path "${env:ProgramFiles}\Inno Setup *" -Filter ISCC.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "Using ISCC: $iscc"
          & $iscc "setup_tools\inno-win-setup\${{ matrix.iss }}"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      # The .iss files name the installer after __version__/__codename__; rename it
      # to the common DDT4ALL-<version>-<platform>-<arch> scheme.
      - name: Collect installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $built = @(Get-ChildItem "setup_tools\inno-win-setup\Output\*.exe")
          if ($built.Count -ne 1) { throw "Expected exactly one installer, found $($built.Count)" }
          New-Item -ItemType Directory -Force -Path dist-packages | Out-Null
          $target = "dist-packages\DDT4ALL-$env:VERSION-windows-${{ matrix.arch }}-setup.exe"
          Copy-Item $built[0].FullName $target
          Get-Item $target | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ matrix.arch }}
          path: dist-packages/*.exe
          if-no-files-found: error
          retention-days: 14

  windows-portable:
    name: Windows portable
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[can,network]"
          python -m pip install pyinstaller

      - name: Build portable zip
        shell: pwsh
        run: ./setup_tools/windows/build-portable.ps1 $env:VERSION

      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem dist-packages\*.zip | Select-Object -First 1
          if (-not $zip) { throw "No portable zip produced" }
          $dest = Join-Path $env:RUNNER_TEMP "portable-check"
          Expand-Archive -Path $zip.FullName -DestinationPath $dest -Force
          $exe = Join-Path $dest "DDT4ALL\DDT4ALL.exe"
          if (-not (Test-Path $exe)) { throw "DDT4ALL.exe not found in $($zip.Name)" }
          Write-Host "OK: $exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist-packages/*.zip
          if-no-files-found: error
          retention-days: 14

  linux-appimage:
    name: Linux AppImage
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libgl1 \
            libfuse2 \
            libbluetooth-dev

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -e ".[can,network,bluetooth]"

      - name: Build AppImage
        run: bash setup_tools/appimage/build.sh "${VERSION}"

      # build.sh writes ddt4all-<version>-x86_64.AppImage; rename to the common scheme.
      - name: Collect AppImage
        run: |
          set -euo pipefail
          mkdir -p dist-packages
          mv "ddt4all-${VERSION}-x86_64.AppImage" "dist-packages/DDT4ALL-${VERSION}-linux-x86_64.AppImage"
          ls -lh dist-packages

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist-packages/*.AppImage
          if-no-files-found: error
          retention-days: 14

  linux-packages:
    name: Linux deb/rpm
    needs: version
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ruby ruby-dev rpm build-essential \
            libxcb-xinerama0 libgl1 libbluetooth-dev
          sudo gem install --no-document fpm

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[can,network]"
          python -m pip install pyinstaller

      - name: Build deb and rpm
        run: bash setup_tools/linux/build-packages.sh "${VERSION}"

      - name: Smoke test (install .deb)
        run: |
          set -euo pipefail
          ls -lh dist-packages
          sudo apt-get install -y ./dist-packages/*.deb
          test -e /opt/ddt4all/DDT4ALL
          dpkg -L ddt4all | grep -E 'ddt4all\.desktop$'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist-packages/*.deb
            dist-packages/*.rpm
          if-no-files-found: error
          retention-days: 14

  macos-dmg:
    name: macOS dmg
    needs: version
    runs-on: macos-14
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[can,network]"
          python -m pip install pyinstaller

      - name: Build dmg
        run: bash setup_tools/mac-os/builddmg.sh "${VERSION}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist-packages/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows-installer
      - windows-portable
      - linux-appimage
      - linux-packages
      - macos-dmg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List files
        run: ls -lh release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
